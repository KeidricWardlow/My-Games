<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>K's Games</title>  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">  
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, teal, white);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-y: auto;
      padding: 40px 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      width: 100%;
      max-width: 100vh;
      text-align: center;
      z-index: 2;
    }

    li a {
      display: block;
      text-decoration: none;
      font-weight: 600;
      padding: 10px;
      border: 2px solid black;
      border-radius: 8px;
      margin: 6px 0;
      background: white;
      transition: 0.2s;
    }

    li a:hover {
      background: black;
      color: teal;
    }

    .read {
      color: gray;
    }

    .unread {
      color: blue;
    }

    .background-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.08;
      width: 90%;
      height: 90%;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
    }

    .overlay-watermark {
      position: fixed;
      bottom: 10px;
      right: 20px;
      width: 120px;
      opacity: 0.4;
      z-index: 3;
      pointer-events: none;
    }

    .watermark {
      position: fixed;
      bottom: 10px;
      left: 20px;
      font-size: 0.9rem;
      color: rgba(0, 0, 0, 0.5);
      z-index: 3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <img src="totaledcomputer.jpg" class="background-image" alt="Background image">

  <ul>
    <li><a href="https://teal-moonbeam-f3b629.netlify.app/" target="_blank">Car Racing</a></li>
  </ul>

  <img src="totaledcomputer.jpg" class="overlay-watermark" alt="Watermark image">
  <div class="watermark">© 2025 K’s Tools</div>

  <script>
    const links = document.querySelectorAll("ul li a");
    const readLinks = JSON.parse(localStorage.getItem("readLinks")) || [];

    links.forEach(link => {
      const href = link.getAttribute("href");
      if (readLinks.includes(href)) {
        link.classList.add("read");
      } else {
        link.classList.add("unread");
      }
      link.addEventListener("click", () => {
        if (!readLinks.includes(href)) {
          readLinks.push(href);
          localStorage.setItem("readLinks", JSON.stringify(readLinks));
          link.classList.remove("unread");
          link.classList.add("read");
        }
      });
    });
  </script>
</body>
</html>
